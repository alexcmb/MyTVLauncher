name: CodeQL

# GitHub's semantic security analysis of the Kotlin code (free for public repositories).
# Findings show up under Security → Code scanning, and on the pull request that adds them.
# Runs on pull requests, on main, and weekly — new queries can find issues in old code.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * 1'
  # "Run workflow" in the Actions tab: re-analyse a branch on demand (e.g. if a push event
  # was missed and the alerts still describe older code).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: java-kotlin
          # Kotlin has to be compiled for CodeQL to see it; it watches the build below.
          build-mode: manual
          queries: security-and-quality

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --no-build-cache --rerun-tasks

      - name: Analyze
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:java-kotlin
